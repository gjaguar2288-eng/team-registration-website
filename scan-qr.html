<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Registration - Scannable QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .qr-section {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 40px;
        }
        
        #qrCode {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin: 30px 0;
            border: 3px solid #667eea;
        }
        
        #qrCode img,
        #qrCode canvas {
            display: block;
        }
        
        .instruction {
            font-size: 1.1rem;
            color: #555;
            margin: 20px 0;
            line-height: 1.6;
        }
        
        .url {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
            word-break: break-all;
            font-size: 1.05rem;
        }
        
        .status {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 5px;
            margin-top: 30px;
            color: #2e7d32;
            font-size: 0.95rem;
        }
        
        .status strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="qr-section">
        <h1>📱 SCAN ME!</h1>
        <p class="subtitle">Team Registration Website</p>
        
        <div id="qrCode"></div>
        
        <p class="instruction">Point your phone camera at this QR code</p>
        
        <div class="url" id="urlDisplay">
            http://localhost:3000
        </div>
        
        <p class="instruction">
            👆 This is the website URL<br>
            Team members can scan the QR code above to access it
        </p>
        
        <div class="status">
            <strong>⚠️ Important:</strong>
            Before scanning, make sure the website is running on your computer with: <code>npm start</code>
        </div>
    </div>

    <script>
        // Website URL - Change this to your deployed URL
        const websiteUrl = 'http://localhost:3000';
        
        // Update URL display
        document.getElementById('urlDisplay').textContent = websiteUrl;
        
        // Generate QR Code
        new QRCode(document.getElementById('qrCode'), {
            text: websiteUrl,
            width: 300,
            height: 300,
            colorDark: '#667eea',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
